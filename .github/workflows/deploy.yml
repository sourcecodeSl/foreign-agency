name: Deploy to FTP

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend-laravel/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# The subdomain document root is the Laravel app folder, and its .htaccess
# rewrites every request into public/. So the React build has to land in
# public/ - uploading it to the document root leaves it unreachable, which is
# why an old login page stayed live after the register link was removed.
#
# vendor/ is deliberately NOT deployed here: it is 8,400+ files and FTP uploads
# one file at a time, which ran for 9.5 minutes and then failed. It only needs
# re-uploading when composer.lock changes - use the "Deploy vendor" workflow
# for that.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Fail if the build still contains the sign-up link
        run: |
          if grep -rq "Create one" frontend/dist/assets/*.js; then
            echo "The removed sign-up link is still in the bundle - refusing to deploy."
            exit 1
          fi
          echo "Bundle looks right: $(ls frontend/dist/assets)"

      # index.php and .htaccess in public/ belong to Laravel, so only the
      # React output is replaced.
      - name: Stage the React build into the Laravel public folder
        run: |
          rm -rf backend-laravel/public/assets
          cp -r frontend/dist/assets backend-laravel/public/assets
          cp frontend/dist/index.html backend-laravel/public/index.html
          if [ -f frontend/dist/favicon.ico ]; then
            cp frontend/dist/favicon.ico backend-laravel/public/favicon.ico
          fi

      - name: Show what will be uploaded
        run: |
          echo "Files to upload (vendor excluded):"
          find backend-laravel -type f -not -path '*/vendor/*' | wc -l

      # dangerous-clean-slate is deliberately off: it would wipe .env,
      # storage/ and vendor/ on the server.
      - name: Deploy the app to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend-laravel/
          server-dir: ./
          log-level: standard
          exclude: |
            **/vendor/**
            **/node_modules/**
            **/.git*
            **/.git*/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/install/**
