name: Deploy to FTP

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend-laravel/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# The subdomain document root is the Laravel app folder, and its .htaccess
# rewrites every request into public/. So the React build has to land in
# public/ - uploading it to the document root leaves it unreachable, which is
# why an old login page stayed live after the register link was removed.
#
# vendor/ is deliberately NOT deployed here: it is 8,400+ files and FTP uploads
# one file at a time. It only needs re-uploading when composer.lock changes -
# use the "Deploy vendor" workflow for that.
#
# Transfers use lftp rather than an FTP action. The shared host kept closing
# the control connection mid-upload ("Server sent FIN packet unexpectedly"),
# which killed the whole run; lftp reconnects and carries on from where it
# stopped.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Fail if the build still contains the sign-up link
        run: |
          if grep -rq "Create one" frontend/dist/assets/*.js; then
            echo "The removed sign-up link is still in the bundle - refusing to deploy."
            exit 1
          fi
          echo "Bundle looks right: $(ls frontend/dist/assets)"

      # index.php and .htaccess in public/ belong to Laravel, so only the
      # React output is replaced.
      - name: Stage the React build into the Laravel public folder
        run: |
          rm -rf backend-laravel/public/assets
          cp -r frontend/dist/assets backend-laravel/public/assets
          cp frontend/dist/index.html backend-laravel/public/index.html
          if [ -f frontend/dist/favicon.ico ]; then
            cp frontend/dist/favicon.ico backend-laravel/public/favicon.ico
          fi
          echo "Files to upload: $(find backend-laravel -type f -not -path '*/vendor/*' | wc -l)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # --only-newer means an interrupted run resumes instead of restarting,
      # and parallel=1 keeps within the connection limit shared hosts enforce.
      - name: Upload the app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 10;
            set net:persist-retries 10;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set mirror:parallel-transfer-count 1;
            set xfer:clobber on;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --only-newer --continue --verbose=1 \
              --exclude '^vendor/' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^install/' \
              --exclude '^\.git' \
              --exclude '^\.env' \
              --exclude '^storage/logs/' \
              --exclude '^storage/framework/(cache|sessions|views)/' \
              ./backend-laravel/ ./;
          "

      # Only a completely unreachable site fails the run. A 500 usually means
      # the database upgrade (sql/live-upgrade.sql) has not been applied yet,
      # which is not a reason to call the file transfer broken.
      - name: Confirm the site answers
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -L https://foreign-agency.solidrow.lk/api/v1/agencies || echo 000)
          echo "GET /api/v1/agencies -> $code"
          case "$code" in
            401) echo "Laravel is alive and the API is responding." ;;
            000) echo "The site did not respond at all."; exit 1 ;;
            5*)  echo "WARNING: $code - deploy went through, but the app is erroring."
                 echo "Have you run backend-laravel/sql/live-upgrade.sql on the live database?" ;;
            *)   echo "Unexpected status $code - check the site." ;;
          esac
